<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invitation card</title>
<style>
  :root { --knob-density: 4; --knob-accent: #3b6cff; color-scheme: light dark; }
  html { background: #f4f1ec; color: #1d1b20; }
  html[data-theme="dark"] { background: #16151a; color: #f1eee8; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.4 Georgia, "Times New Roman", serif; }
  .card { box-sizing: border-box; width: min(100% - 32px, 460px); padding: calc(10px + (10 - var(--knob-density)) * 5px); border-radius: 18px; background: #fffdf8; color: #1d1b20; text-align: center; box-shadow: 0 12px 40px -16px rgba(0,0,0,.35); border-top: 6px solid var(--knob-accent); }
  html[data-theme="dark"] .card { background: #24222b; color: #f1eee8; }
  .photo { width: calc(60px + var(--knob-density) * 6px); height: calc(60px + var(--knob-density) * 6px); margin: 0 auto 12px; border-radius: 50%; background: #d9d4ca center / cover; }
  .names { font-size: calc(22px + (10 - var(--knob-density)) * 1.6px); margin: 0 0 6px; color: var(--knob-accent); }
  .when { margin: 0; font-size: calc(13px + var(--knob-density) * .5px); opacity: .75; }
  .more { margin-top: calc(var(--knob-density) * 2px); font-size: 13px; opacity: calc(var(--knob-density) / 10); }
</style>
</head>
<body>
  <main class="card">
    <div class="photo" data-knob="photo"></div>
    <h1 class="names" data-knob="names">Anna and Misha</h1>
    <p class="when">Saturday, 14 June, 16:00 · Garden hall</p>
    <p class="more">Dress code: summer colours. Dinner at 18:00.</p>
  </main>
</body>
</html>
