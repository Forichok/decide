<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>roomy task row</title>
<style>
body{margin:0;padding:16px;background:#f6f2ee;font-family:-apple-system,"Segoe UI",sans-serif;color:#1d1b1a}
.row{display:flex;align-items:center;gap:20px;background:#fff;border:1px solid #ece6df;border-radius:14px;padding:22px;margin-bottom:14px}
.box{width:20px;height:20px;border-radius:6px;border:2px solid #cfc7bd;flex:none}
.t{font-size:17px;font-weight:600}.s{font-size:13px;color:#8b847c;margin-top:4px}
.due{margin-left:auto;font-size:12px;color:#c21f58;background:#fdeaf1;border-radius:999px;padding:2px 8px;white-space:nowrap}
</style></head><body>
<div class="row"><span class="box"></span><div><div class="t">Send the invoice</div><div class="s">Client asked for it by noon</div></div><span class="due">noon</span></div>
<div class="row"><span class="box"></span><div><div class="t">Book the venue</div><div class="s">Two quotes are in</div></div><span class="due">Fri</span></div>
<div class="row"><span class="box"></span><div><div class="t">Call the printer</div><div class="s">About the poster sizes</div></div></div>
<div class="row"><span class="box"></span><div><div class="t">Water the plants</div></div></div>
</body></html>
