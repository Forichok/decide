<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:Geist;src:url(../../node_modules/geist/dist/fonts/geist-sans/Geist-Variable.woff2) format("woff2");font-weight:100 900}
body{margin:0;background:#050507;font-family:Geist}
.v{width:1600px;height:900px;position:relative;overflow:hidden;background:radial-gradient(900px 600px at 30% 30%,rgba(124,77,255,.18),transparent),radial-gradient(800px 600px at 80% 80%,rgba(255,93,143,.14),transparent),#050507;color:#f4f4f5}

.word{font-weight:650;font-size:190px;letter-spacing:-.045em;line-height:1}
.i{position:relative;display:inline-block}

.chip{display:flex;align-items:center;gap:28px;padding:28px 36px;border-radius:22px;background:#111116;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.chip.light{background:#f4f4f5}
.name{position:absolute;left:60px;top:48px;font:600 30px Geist;color:#a3a3ab}

<div id="out"></div>

const V=[["m1","A · the dot becomes the d"],["m2","B · two sides, one picked"],["m3","C · the fork, one way taken"],["m4","D · the current check, tidied"]];
const mk=(id,s,col)=>{const d=document.createElement('div');d.style.cssText=`width:${s}px;height:${s}px;color:${col};display:flex`;d.innerHTML=document.getElementById(id).innerHTML;d.firstElementChild.setAttribute('width',s);d.firstElementChild.setAttribute('height',s);return d.outerHTML};

</script>
